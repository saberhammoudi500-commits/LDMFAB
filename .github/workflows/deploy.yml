name: Deploy LDMFAB → Railway

on:
  push:
    branches:
      - main
      - claude/eloquent-einstein-7cw4hu

jobs:
  build-and-deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # ── Build Frontend ──────────────────────────────────────
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install

      - name: Build frontend
        working-directory: frontend
        run: npm run build
        env:
          VITE_API_URL: /api

      # ── Build Backend ───────────────────────────────────────
      - name: Install backend dependencies
        working-directory: backend
        run: npm install

      - name: Generate Prisma client
        working-directory: backend
        run: npx prisma generate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}

      - name: Push DB schema + Seed
        working-directory: backend
        run: npx prisma db push --accept-data-loss && npx tsx prisma/seed.ts
        env:
          DATABASE_URL: ${{ secrets.DIRECT_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
          NODE_ENV: production
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          ADMIN_MATRICULE: ${{ secrets.ADMIN_MATRICULE }}

      - name: Build backend
        working-directory: backend
        run: npm run build
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}

      # ── Deploy to Railway ───────────────────────────────────
      - name: Deploy to Railway
        uses: railwayapp/nixpacks-action@v1
        with:
          token: ${{ secrets.RAILWAY_TOKEN }}
